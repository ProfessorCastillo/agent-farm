<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    >
    <title>cosmic web</title>
    <style>
      :root {
        --bg: #050508;
        --bg2: #0a0a12;
        --fg: #f0f0f5;
        --muted: #6e6e80;
        --accent: #6366f1;
        --accent2: #a855f7;
        --size: 14px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        line-height: 1.5;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        z-index: 0;
        touch-action: none;
      }
      .ui-layer {
        position: relative;
        z-index: 1;
        pointer-events: none;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
      }
      header {
        max-width: 40rem;
        pointer-events: auto;
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 0.25rem;
        background: linear-gradient(to right, var(--fg), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tagline { color: var(--muted); font-size: var(--size); opacity: 0.8; }
      .stats {
        display: flex;
        gap: 1.5rem;
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .stat-val { color: var(--accent); font-weight: 600; }
      .toolbar {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        padding: 1rem;
        background: rgba(10, 10, 18, 0.6);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        width: fit-content;
        margin: 0 auto;
      }
      .group {
        display: flex;
        gap: 0.25rem;
        align-items: center;
        padding: 0.25rem;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 16px;
      }
      .label {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        padding: 0 0.5rem;
        user-select: none;
      }
      button {
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--fg);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      button:hover { background: rgba(255, 255, 255, 0.05); }
      button[aria-pressed="true"] {
        background: var(--accent);
        color: white;
      }
      button.icon { padding: 0.4rem 0.6rem; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
      button:disabled { opacity: 0.3; cursor: not-allowed; }
      @media (max-width: 640px) {
        .ui-layer { padding: 1rem; }
        h1 { font-size: 1.75rem; }
        .toolbar { border-radius: 16px; }
        .label { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="ui-layer">
      <header>
        <h1 id="headline">cosmic web</h1>
        <p class="tagline" id="hint">interact to weave the fabric of space</p>
        <div class="stats">
          <div>Nodes: <span class="stat-val" id="count">0</span></div>
          <div>Peak: <span class="stat-val" id="peak">0</span></div>
          <div>FPS: <span class="stat-val" id="fps">0</span></div>
        </div>
      </header>
      <nav class="toolbar" aria-label="Controls">
        <div class="group">
          <span class="label">Theme</span>
          <button class="theme-btn" data-theme="void" aria-pressed="true">Void</button>
          <button class="theme-btn" data-theme="nebula" aria-pressed="false">Nebula</button>
          <button class="theme-btn" data-theme="plasma" aria-pressed="false">Plasma</button>
          <button class="theme-btn" data-theme="frozen" aria-pressed="false">Frozen</button>
        </div>
        <div class="group">
          <span class="label">Gravity</span>
          <button class="grav-btn" data-mode="attract" aria-pressed="true">Pull</button>
          <button class="grav-btn" data-mode="repel" aria-pressed="false">Push</button>
          <button class="grav-btn" data-mode="orbit" aria-pressed="false">Orbit</button>
        </div>
        <div class="group">
          <span class="label">Nodes</span>
          <button class="density-btn icon" id="densityMinus">−</button>
          <button class="density-btn" id="densityValue" disabled>80</button>
          <button class="density-btn icon" id="densityPlus">+</button>
        </div>
        <div class="group">
          <button id="playPause" aria-pressed="false">Pause</button>
        </div>
      </nav>
    </div>
    <script>
      (() => {
        const THEMES = {
          void: {
            name: 'cosmic web',
            hint: 'interact to weave the fabric of space',
            bg0: '#050508', bg1: '#0a0a12',
            hsl: [230, 40], accent: '#6366f1', accent2: '#a855f7'
          },
          nebula: {
            name: 'stardust nebula',
            hint: 'stir the clouds of gaseous light',
            bg0: '#0a050f', bg1: '#160a1f',
            hsl: [280, 60], accent: '#d946ef', accent2: '#f472b6'
          },
          plasma: {
            name: 'solar plasma',
            hint: 'disturb the currents of a dying star',
            bg0: '#0f0a05', bg1: '#1f160a',
            hsl: [20, 40], accent: '#f59e0b', accent2: '#ef4444'
          },
          frozen: {
            name: 'glacial rift',
            hint: 'touch the silence of absolute zero',
            bg0: '#050f12', bg1: '#0a1f25',
            hsl: [180, 40], accent: '#06b6d4', accent2: '#3b82f6'
          }
        };

        const MIN_particles = 20;
        const MAX_particles = 250;
        const STEP = 10;
        const CONN_DIST = 100;

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const root = document.documentElement;

        let particles = [];
        let animationId = null;
        let pointer = { x: null, y: null };
        let peakCount = 0;
        let gravity = 'attract';
        let density = 80;
        let theme = THEMES.void;
        let isPaused = false;

        function setTheme(key) {
          theme = THEMES[key];
          root.style.setProperty('--bg', theme.bg0);
          root.style.setProperty('--bg2', theme.bg1);
          root.style.setProperty('--accent', theme.accent);
          root.style.setProperty('--accent2', theme.accent2);
          document.getElementById('headline').textContent = theme.name;
          document.getElementById('hint').textContent = theme.hint;
          document.body.style.background = theme.bg0;
          document.querySelectorAll('.theme-btn').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.theme === key)));
        }

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function createParticle() {
          const h = Math.random();
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.2 + Math.random() * 0.8;
          return {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 1 + Math.random() * 1.5,
            color: `hsl(${theme.hsl[0] + h * theme.hsl[1]}, 70%, 65%)`,
            friction: 0.99
          };
        }

        function initParticles(n) {
          particles = [];
          for (let i = 0; i < n; i++) particles.push(createParticle());
          if (particles.length > peakCount) peakCount = particles.length;
        }

        function update() {
          if (isPaused) return;

          const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          grad.addColorStop(0, theme.bg0);
          grad.addColorStop(1, theme.bg1);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const gx = pointer.x, gy = pointer.y;
          
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (gx != null && gy != null) {
              const dx = gx - p.x;
              const dy = gy - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const force = 0.002;
              if (gravity === 'attract') {
                p.vx += dx * force;
                p.vy += dy * force;
              } else if (gravity === 'repel') {
                p.vx -= dx * force;
                p.vy -= dy * force;
              } else if (gravity === 'orbit') {
                p.vx += dy * force;
                p.vy -= dx * force;
              }
            }
            p.vx *= p.friction;
            p.vy *= p.friction;
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;
          }

          ctx.lineWidth = 0.8;
          for (let i = 0; i < particles.length; i++) {
            const p1 = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p1.x - p2.x;
              const dy = p1.y - p2.y;
              const distSq = dx * dx + dy * dy;
              if (distSq < CONN_DIST * CONN_DIST) {
                const dist = Math.sqrt(distSq);
                const alpha = 1 - dist / CONN_DIST;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          }

          ctx.globalCompositeOperation = 'lighter';
          for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
          }
          ctx.globalCompositeOperation = 'source-over';
        }

        let fpsFrames = 0;
        let fpsLast = performance.now();
        function animate() {
          update();
          fpsFrames++;
          const now = performance.now();
          if (now - fpsLast >= 500) {
            document.getElementById('fps').textContent = Math.round((fpsFrames * 1000) / (now - fpsLast));
            fpsFrames = 0;
            fpsLast = now;
          }
          animationId = requestAnimationFrame(animate);
        }

        canvas.addEventListener('pointermove', e => {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
        });
        canvas.addEventListener('pointerleave', () => { pointer.x = null; pointer.y = null; });

        document.querySelectorAll('.theme-btn').forEach(btn => {
          btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });
        document.querySelectorAll('.grav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            gravity = btn.dataset.mode;
            document.querySelectorAll('.grav-btn').forEach(b =>
              b.setAttribute('aria-pressed', String(b.dataset.mode === gravity)));
          });
        });

        const densityValueBtn = document.getElementById('densityValue');
        document.getElementById('densityMinus').addEventListener('click', () => {
          density = Math.max(MIN_particles, density - STEP);
          densityValueBtn.textContent = density;
          initParticles(density);
        });
        document.getElementById('densityPlus').addEventListener('click', () => {
          density = Math.min(MAX_particles, density + STEP);
          densityValueBtn.textContent = density;
          initParticles(density);
        });

        document.getElementById('playPause').addEventListener('click', (e) => {
          isPaused = !isPaused;
          e.target.textContent = isPaused ? 'Play' : 'Pause';
          e.target.setAttribute('aria-pressed', String(isPaused));
        });

        setTheme('void');
        densityValueBtn.textContent = density;
        initParticles(density);
        document.getElementById('count').textContent = density;
        document.getElementById('peak').textContent = density;
        animate();
      })();
    </script>
  </body>
</html>
