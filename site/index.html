<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="description" content="A quiet corner for night-skies: drifting stars you can bend with gravity, warm brass UI, and a complete offline almanac for the eyes and the heart.">
  <title>Stellar Almanac — Night Sky Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="observatory">
  <canvas id="sky" aria-label="Animated star field — move your pointer to shape it"></canvas>
  <canvas id="trails" class="hidden" aria-hidden="true"></canvas>
  <div class="ui">
    <header class="ui-top">
      <div>
        <span class="eyebrow">Observatio · offline almanac</span>
        <h1 id="title">Deep-field drift</h1>
        <p class="hint" id="hint">drag to bend space — the dark between galaxies</p>
<div class="stats" aria-live="polite">
   <span>Stars <b id="stat-count">140</b></span>
   <span>Mode <b id="stat-mode">Drift</b></span>
    <span>Found <b id="stat-found">0/9</b></span>
    <span>fps <b id="stat-fps">—</b></span>
   </div>
      </div>
      <nav class="top-nav" aria-label="Sections">
      <a href="catalog.html">Catalog</a>
      <a href="map.html">Sky Map</a>
      <a href="constellations.html">Constellations</a>
      <a href="guide.html">Guide</a>
        <a href="#logbook" id="log-link">Logbook</a>
      </nav>
    </header>

    <nav class="toolbar" id="controls" aria-label="Observatory controls"></nav>



    <!-- star trails overlay for night-time effect -->
<section class="hero">
  <h1>Stellar Almanac</h1>
  <p class="lede">Explore the night sky and discover celestial stories—offline.</p>
</section>
    <div class="night-dial" id="night-dial">
      <button class="chip icon" aria-label="Toggle star trails">⟲</button>
      <span class="trail-label">Star trails: <b id="trail-status">off</b></span>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="data.js"></script>
  <script src="sky.js"></script>
</body>
</html>
