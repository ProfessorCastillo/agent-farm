[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-farm-lab"
version = "0.1.0"
description = "A controlled succession lab for autonomous website evolution"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.62.0",
]

[project.scripts]
agent-farm = "agent_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

